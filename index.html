<html lang="ja">
<head>

try{ var __d = JSON.parse(localStorage.getItem('periodicDrillV1')||'{}'); if(__d && __d.darkMode) document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap');

:root{
  --paper:#EDF1EA;
  --panel:#E3E9DF;
  --panel-2:#D9E0D4;
  --ink:#1B2420;
  --ink-soft:#54604F;
  --line:#B9C4B4;
  --edge:#1B2420;
  --cell-ink:#1B2420;
  --overlay-bg:rgba(27,36,32,0.6);
  --toast-bg:#1B2420;

  --accent:#2F6E5C;
  --accent-soft:#DCE9E2;
  --target:#C4832E;
  --good:#3E7D4A;
  --bad:#B0402E;
  --hint:#4C7A9E;

  --cat-alkali:#D98F82;
  --cat-alkaline:#E3B36B;
  --cat-transition:#8FAAC2;
  --cat-lanth:#B79AC9;
  --cat-act:#9AA3C9;
  --cat-post:#9FBB8C;
  --cat-metalloid:#C7B074;
  --cat-nonmetal:#77BBA8;
  --cat-halogen:#D6A25B;
  --cat-noble:#A9A296;
  --locked-a:#DBE0D6;
  --locked-b:#CBD2C4;

  --font-ui:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Segoe UI",sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,"SF Mono",Consolas,monospace;

  --cell: clamp(24px, 3.6vw, 44px);
  --radius: 5px;
}

/* ---------- Dark theme（元素マスター達成で解放） ---------- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1411;
  --panel:#151D19;
  --panel-2:#1F2A25;
  --ink:#E3EAE5;
  --ink-soft:#9BA9A0;
  --line:#2B3932;
  --edge:#41524A;
  --accent:#2F8A72;
  --accent-soft:#1D372E;
  --target:#D99B46;
  --good:#4C9A5A;
  --bad:#C85A48;
  --hint:#6AA3CC;
  --cat-alkali:#BF7E72;
  --cat-alkaline:#C89E5E;
  --cat-transition:#7E96AB;
  --cat-lanth:#A188B1;
  --cat-act:#888FB1;
  --cat-post:#8CA57B;
  --cat-metalloid:#AF9B66;
  --cat-nonmetal:#69A594;
  --cat-halogen:#BC8F50;
  --cat-noble:#958F84;
  --locked-a:#17201C;
  --locked-b:#1F2B25;
  --overlay-bg:rgba(0,0,0,0.72);
  --toast-bg:#050807;
}
/* テーマ切替時だけ、色がゆっくり変わるようにする */
.theme-fade, .theme-fade *{
  transition:background-color 1.2s ease, color 1.2s ease, border-color 1.2s ease !important;
}


*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;}
input{font-family:inherit;}

#app{
  max-width:1040px;
  margin:0 auto;
  padding:14px 14px 40px;
}

/* ---------- Header ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding-bottom:10px;
  border-bottom:2px solid var(--edge);
  margin-bottom:10px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand svg{ display:block; }
.brand-text{ font-weight:700; font-size:1.25rem; letter-spacing:-0.01em; }
.brand-text small{
  display:block; font-weight:500; font-size:0.6rem;
  color:var(--ink-soft); letter-spacing:0.04em; margin-top:1px;
}
.topbar-right{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; min-width:0; max-width:100%; }
.range-field{ display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--ink-soft); min-width:0; max-width:100%; }
.range-field label{ flex:none; white-space:nowrap; }
.range-field select{
  font-family:var(--font-mono); font-size:0.85rem; font-weight:700;
  color:var(--ink); background:var(--panel); border:1.5px solid var(--edge);
  border-radius:var(--radius); padding:6px 8px; cursor:pointer;
  min-width:0; max-width:100%; text-overflow:ellipsis; /* 長い選択肢名で画面を押し広げない */
}
@media (max-width:640px){
  .topbar-right{ width:100%; }
  .profile-field{ flex-wrap:wrap; }
  .range-field{ width:100%; }
  .range-field select{ flex:1 1 auto; width:100%; }
}
.profile-field{ display:flex; align-items:center; gap:6px; font-size:0.82rem; }
.nickname-display{ font-weight:700; }
.level-badge{
  font-weight:700; font-size:0.72rem; background:var(--accent); color:#fff;
  padding:3px 9px; border-radius:999px; font-family:var(--font-mono);
}
.streak-display{ font-weight:700; font-size:0.82rem; }

.xp-bar-track{
  height:4px; width:100%; background:var(--panel-2); border-radius:2px;
  overflow:hidden; margin-bottom:10px;
}
.xp-bar-fill{
  height:100%; width:0%; background:var(--accent);
  transition:width .4s ease;
}

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:2px; overflow-x:auto; margin-bottom:14px; -webkit-overflow-scrolling:touch; }
.tab{
  flex:0 0 auto; background:none; border:none; border-bottom:3px solid transparent;
  color:var(--ink-soft); font-size:0.86rem; font-weight:700; padding:9px 12px 7px;
  cursor:pointer; white-space:nowrap; transition:color .15s, border-color .15s, background-color .15s;
}
.tab:hover{ background:var(--panel); color:var(--ink); }
.tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

/* ---------- Stage / prompt ---------- */
.stage{ background:var(--panel); border:1.5px solid var(--edge); border-radius:8px; padding:16px; }
.prompt{ min-height:64px; margin-bottom:8px; }
.prompt-eyebrow{ font-size:0.7rem; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
.prompt-text{ font-size:0.95rem; line-height:1.55; margin:0; }
.prompt-text strong{ color:var(--accent); }
.prompt-text.fact{ color:var(--ink-soft); font-size:0.86rem; margin-top:6px; }

.element-card{
  display:inline-flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--paper); border:1.5px solid var(--edge); border-radius:8px;
  padding:14px 26px; margin-bottom:8px;
}
.element-card.small{ padding:8px 16px; }
.element-card-sym{ font-family:var(--font-mono); font-weight:700; font-size:2.4rem; line-height:1; }
.element-card.small .element-card-sym{ font-size:1.5rem; }
.element-card-name{ font-size:0.95rem; color:var(--ink-soft); font-weight:500; }

.feedback{
  min-height:1.4em; font-size:0.88rem; font-weight:700; margin:4px 0 10px;
  opacity:0; transition:opacity .12s;
}
.feedback.show{ opacity:1; }
.feedback.good{ color:var(--good); }
.feedback.bad{ color:var(--bad); }
.feedback.neutral{ color:var(--target); }

/* ---------- Legend (home only) ---------- */
.legend{
  display:none; flex-wrap:wrap; gap:8px 14px; padding:10px 0 4px; margin-bottom:6px;
  border-top:1px dashed var(--line); border-bottom:1px dashed var(--line);
}
body[data-mode="home"] .legend{ display:flex; }
.legend-item{ display:flex; align-items:center; gap:5px; font-size:0.72rem; color:var(--ink-soft); }
.legend-swatch{ width:11px; height:11px; border-radius:3px; border:1px solid rgba(0,0,0,0.25); flex:0 0 auto; }

/* ---------- Table ---------- */
.table-wrap{ overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch; }
.ptable{
  display:grid;
  grid-template-columns: repeat(18, var(--cell));
  grid-template-rows: repeat(7, var(--cell)) calc(var(--cell) * 0.32) repeat(2, var(--cell));
  gap:3px; width:max-content; margin:0 auto;
}
.cell{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:4px; cursor:pointer; user-select:none; color:var(--cell-ink);
  transition:transform .1s, box-shadow .15s; overflow:hidden;
}
.cell:hover{ transform:scale(1.06); z-index:3; }
.cell .label{ visibility:hidden; position:relative; z-index:2; }
.cell.show-label .label{ visibility:visible; }
.cell .num{
  position:absolute; top:2px; left:3px; font-family:var(--font-mono);
  font-size:calc(var(--cell) * 0.24); opacity:0.6;
}
.cell .sym{ font-family:var(--font-mono); font-weight:700; font-size:calc(var(--cell) * 0.36); }

.cell .liquid{
  position:absolute; left:0; right:0; bottom:0; height:0%;
  background:rgba(41,84,133,0.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.55); /* 液面の境界線。高さ0%の時は何も描かれない */
  z-index:1; transition:height .6s ease; pointer-events:none;
}

.cat-alkali{ background:var(--cat-alkali); }
.cat-alkaline{ background:var(--cat-alkaline); }
.cat-transition{ background:var(--cat-transition); }
.cat-lanth{ background:var(--cat-lanth); }
.cat-act{ background:var(--cat-act); }
.cat-post{ background:var(--cat-post); }
.cat-metalloid{ background:var(--cat-metalloid); }
.cat-nonmetal{ background:var(--cat-nonmetal); }
.cat-halogen{ background:var(--cat-halogen); }
.cat-noble{ background:var(--cat-noble); }

.cell.placeholder{
  font-family:var(--font-mono); font-size:calc(var(--cell) * 0.22);
  text-align:center; line-height:1.15; cursor:default;
}
.cell.placeholder:hover{ transform:none; }
.cell.placeholder .ph-text{ padding:0 2px; opacity:0.85; }

.cell.locked{
  background-image:repeating-linear-gradient(45deg, var(--locked-a), var(--locked-a) 5px, var(--locked-b) 5px, var(--locked-b) 10px);
  pointer-events:none; cursor:default;
}
.cell.locked:hover{ transform:none; }
.cell.locked .label{ visibility:hidden !important; }
.cell.locked.placeholder .ph-text{ visibility:hidden; }

.cell.target{ outline:3px solid var(--target); outline-offset:1px; z-index:2; animation:pulse 1.1s infinite; }
.cell.candidate{ outline:2px solid var(--hint); outline-offset:1px; z-index:2; }
.cell.spotlight{ outline:2px solid var(--hint); outline-offset:1px; z-index:2; }
.cell.correct{ background:var(--good) !important; color:#fff; }
.cell.correct .num{ opacity:0.85; }
.cell.wrong{ background:var(--bad) !important; color:#fff; animation:shake .3s; }
.cell.reveal{ outline:2px dashed var(--target); outline-offset:1px; z-index:2; }
.cell.filled{ cursor:default; }
.cell.mastered::after{
  content:'★'; position:absolute; bottom:1px; right:2px; z-index:2;
  font-size:calc(var(--cell) * 0.28); color:#C4832E; line-height:1;
  text-shadow:0 0 2px rgba(255,255,255,.7);
}
.cell.weak{ box-shadow: inset 0 0 0 2px var(--bad); z-index:1; }

@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(196,131,46,.55); }
  50%{ box-shadow:0 0 0 7px rgba(196,131,46,0); }
}
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-3px); }
  75%{ transform:translateX(3px); }
}
@media (prefers-reduced-motion: reduce){
  .cell.target{ animation:none; }
  .cell.wrong{ animation:none; }
}

.scroll-hint{ display:none; text-align:center; font-size:0.72rem; color:var(--ink-soft); margin-top:-4px; }
@media (max-width:640px){ .scroll-hint{ display:block; } }

/* ---------- Controls / inputs ---------- */
.controls{ margin-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.field-row{ display:flex; gap:8px; flex-wrap:wrap; }
.text-input{
  font-family:var(--font-mono); font-size:1.05rem; font-weight:700; padding:9px 12px;
  border:1.5px solid var(--edge); border-radius:var(--radius); background:var(--paper);
  color:var(--ink); width:150px;
}
.text-input.wide{ width:240px; font-family:var(--font-ui); font-size:1rem; }
.text-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.text-input:disabled{ opacity:0.5; }

.btn{
  font-size:0.85rem; font-weight:700; padding:9px 16px; border-radius:var(--radius);
  border:1.5px solid var(--edge); background:var(--paper); color:var(--ink);
  cursor:pointer; transition:background-color .12s, transform .08s;
}
.btn:hover{ background:var(--accent-soft); }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ background:#265c4d; }
.btn-ghost{ background:transparent; }
.btn-text{
  background:none; border:none; color:var(--ink-soft); font-size:0.75rem; font-weight:700;
  text-decoration:underline; cursor:pointer; padding:4px 0;
}

/* ---------- Status bar ---------- */
.statusbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:16px;
  padding-top:10px; border-top:1px dashed var(--line); font-size:0.82rem;
  color:var(--ink-soft); min-height:20px;
}
.stat strong{ color:var(--ink); font-family:var(--font-mono); }

footer.note{ text-align:center; font-size:0.72rem; color:var(--ink-soft); margin-top:18px; }

/* ---------- Home dashboard ---------- */
.home-dash{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px; margin-bottom:10px;
}
.dash-card{
  background:var(--paper); border:1.5px solid var(--edge); border-radius:8px;
  padding:9px 12px;
}
.dash-label{ font-size:0.68rem; color:var(--ink-soft); font-weight:700; margin-bottom:2px; }
.dash-value{ font-size:0.92rem; font-weight:700; }
.dash-card.dash-wide{ grid-column:1 / -1; }
.mastery-overall{ display:flex; align-items:baseline; gap:3px; }
.mastery-num{ font-family:var(--font-mono); font-size:1.7rem; font-weight:700; line-height:1.1; }
.mastery-note{ margin-left:10px; font-size:0.72rem; font-weight:500; color:var(--ink-soft); }
.mastery-bar{
  height:8px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:4px; overflow:hidden; margin-top:6px;
}
.mastery-bar.small{ height:6px; margin-top:5px; max-width:280px; }
.mastery-bar-fill{ height:100%; width:0%; background:var(--hint); transition:width .5s ease; }
.info-card{ margin-top:2px; }

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(16px);
  background:var(--toast-bg); color:#fff; padding:10px 22px; border-radius:16px;
  border:1px solid transparent;
  font-size:0.85rem; font-weight:700; line-height:1.4; opacity:0; transition:opacity .25s, transform .25s;
  z-index:200; box-shadow:0 4px 16px rgba(0,0,0,.28); width:max-content; max-width:88vw; text-align:center;
  pointer-events:none;
}
:root[data-theme="dark"] .toast{ border-color:var(--edge); }
.toast-title{ font-size:0.88rem; font-weight:700; }
.toast-desc{ font-size:0.72rem; font-weight:500; opacity:0.82; margin-top:2px; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast[hidden]{ display:none; }
.toast.secret{
  background:#05070C; border:1px solid #2A3A55;
  box-shadow:0 0 26px rgba(60,110,180,.45), 0 4px 16px rgba(0,0,0,.55);
  color:#CFE0F5;
}

/* ---------- Achievements list ---------- */
.ach-list{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; }
.ach-row{ border:1.5px solid var(--edge); border-radius:6px; padding:8px 10px; background:var(--paper); }
.ach-row.locked{ opacity:0.5; }
.ach-title{ font-weight:700; font-size:0.88rem; }
.ach-desc{ font-size:0.76rem; color:var(--ink-soft); margin-top:2px; }
.ach-secret-tag{ font-size:0.65em; color:var(--hint); font-weight:700; }
.ach-row.secret{ background:#05070C; border-color:#2A3A55; }
.ach-row.secret .ach-title{ color:#CFE0F5; }
.ach-row.secret .ach-desc{ color:#8FA6C4; }
.ach-row.secret .ach-secret-tag{ color:#6FA0D8; }
.ach-row.gold{ background:linear-gradient(135deg,#120d03,#2a1f08); border-color:#b8923a; }
.ach-row.gold .ach-title{ color:#f1d48a; letter-spacing:.06em; }
.ach-row.gold .ach-desc{ color:#c9b27a; }

/* ---------- Ranking ---------- */
.ranking-tabs{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.rtab{
  font-size:0.78rem; font-weight:700; padding:5px 10px; border:1.5px solid var(--edge);
  border-radius:var(--radius); background:var(--panel); cursor:pointer;
}
.rtab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.ranking-note{ font-size:0.72rem; color:var(--ink-soft); margin:0 0 8px; line-height:1.5; }
.ranking-table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
.ranking-table th, .ranking-table td{ text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
.ranking-table td:first-child, .ranking-table th:first-child{ width:28px; font-family:var(--font-mono); color:var(--ink-soft); }
.ranking-table tr.me{ background:var(--accent-soft); font-weight:700; }
.rank-level{ font-size:0.72em; color:var(--ink-soft); font-weight:500; }
.ranking-close{ margin-top:10px; }

/* ---------- Overlay (nickname / ranking / achievements) ---------- */
.overlay{
  position:fixed; inset:0; background:var(--overlay-bg);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.overlay[hidden]{ display:none; }
.overlay-card{
  background:var(--paper); border:2px solid var(--edge); border-radius:10px;
  padding:24px; max-width:360px; width:100%;
}
.overlay-card.wide{ max-width:520px; max-height:85vh; overflow-y:auto; }
.overlay-card h2{ margin:0 0 8px; font-size:1.1rem; }
.overlay-card p{ font-size:0.85rem; color:var(--ink-soft); line-height:1.55; margin:0 0 14px; }
.overlay-card .text-input{ width:100%; margin-bottom:10px; }
.overlay-card .btn{ width:100%; }

/* ---------- Settings ---------- */
.setting-row{ margin:0 0 16px; }
.setting-row label.setting-label{ display:block; font-size:0.8rem; font-weight:700; margin-bottom:6px; }
.slider-line{ display:flex; align-items:center; gap:12px; }
.slider-line input[type="range"]{ flex:1; accent-color:var(--accent); height:28px; cursor:pointer; }
.slider-line .slider-value{ min-width:3.2em; text-align:right; font-family:var(--font-mono); font-weight:700; font-size:0.9rem; }
.check-line{ display:flex; align-items:center; gap:8px; font-size:0.86rem; cursor:pointer; }
.check-line input{ width:18px; height:18px; accent-color:var(--accent); cursor:pointer; }

/* ---------- 元素マスター達成演出 ---------- */
.master-overlay{
  position:fixed; inset:0; z-index:250; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #1d1606 0%, #0a0803 55%, #000 100%);
  opacity:0; transition:opacity .9s ease; padding:20px; cursor:pointer; overflow:hidden;
}
.master-overlay[hidden]{ display:none; }
.master-overlay.play{ opacity:1; }
.master-overlay.closing{ opacity:0; }
.master-rays{
  position:absolute; inset:0; overflow:hidden; pointer-events:none; contain:strict;
}
.master-rays::before{
  content:''; position:absolute; width:150vmax; height:150vmax; left:50%; top:50%;
  margin:-75vmax 0 0 -75vmax; opacity:.8;
  background:conic-gradient(from 0deg, transparent 0%, rgba(212,170,70,.10) 6%, transparent 14%, rgba(212,170,70,.07) 30%, transparent 40%, rgba(212,170,70,.10) 56%, transparent 66%, rgba(212,170,70,.07) 82%, transparent 92%);
  -webkit-mask-image:radial-gradient(circle, #000 5%, transparent 55%);
  mask-image:radial-gradient(circle, #000 5%, transparent 55%);
  animation:masterSpin 36s linear infinite;
}
@keyframes masterSpin{ to{ transform:rotate(360deg); } }
.master-dust{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.master-dust i{
  position:absolute; bottom:-12px; width:var(--s); height:var(--s); border-radius:50%;
  background:radial-gradient(circle,#fff3c4 0%,#d4aa46 55%,transparent 72%);
  opacity:0; animation:dustRise var(--d) var(--delay) linear infinite;
}
@keyframes dustRise{
  0%{ transform:translate(0,0) scale(.6); opacity:0; }
  15%{ opacity:.95; }
  100%{ transform:translate(var(--x),-108vh) scale(1.1); opacity:0; }
}
.master-frame{
  position:relative; max-width:560px; width:100%; text-align:center; padding:48px 26px 38px;
  border:1px solid #b8923a;
  box-shadow:0 0 0 6px #000, 0 0 0 7px rgba(184,146,58,.55), 0 0 70px rgba(212,170,70,.22), inset 0 0 60px rgba(212,170,70,.07);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Times New Roman",serif;
  transform:scale(.94); opacity:0;
}
.master-frame::before, .master-frame::after{
  content:'◆'; position:absolute; left:50%; transform:translateX(-50%);
  color:#d4aa46; font-size:14px; background:#000; padding:0 12px; line-height:1;
}
.master-frame::before{ top:-9px; }
.master-frame::after{ bottom:-9px; }
.master-overlay.play .master-frame{ animation:masterFrameIn 1.5s .2s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes masterFrameIn{ to{ transform:scale(1); opacity:1; } }
.master-eyebrow{

function normalizeSettings(raw){
  const v = (raw && typeof raw.volume==='number') ? Math.max(0, Math.min(1, raw.volume)) : 0.6;
  return { volume:v, muted: !!(raw && raw.muted) };

      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed==='object'){
        return {
          nickname: parsed.nickname || null,
          records: parsed.records || {},
          rankingLog: Array.isArray(parsed.rankingLog) ? parsed.rankingLog : [],
          xp: typeof parsed.xp==='number' ? parsed.xp : 0,

          bestDailyStreak: typeof parsed.bestDailyStreak==='number' ? parsed.bestDailyStreak : 0,
          lastPlayedDate: parsed.lastPlayedDate || null,

          shareCount: typeof parsed.shareCount==='number' ? parsed.shareCount : 0,

/* =========================================================
   2a-0. 効果音（Web Audio API で合成。音声ファイルは使わない）
   ========================================================= */
const Sound = (function(){
  let ctx = null, master = null, revBus = null, noiseBuf = null;
  const BOOST = 2.2;

  function volumeGain(){
    const s = store.settings;
    if(!s || s.muted) return 0;
    const v = Math.max(0, Math.min(1, s.volume));
    return v * v * BOOST; // 体感に合わせて二乗カーブ
  }
  function makeImpulse(seconds, decay){
    const rate = ctx.sampleRate, len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for(let c=0;c<2;c++){
      const d = buf.getChannelData(c);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
    return buf;
  }
  function init(){
    if(ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{ ctx = new AC(); }catch(err){ ctx = null; return false; }

    // 重ねた音が大きくなりすぎても割れないよう、最後に tanh のソフトリミッターを通す
    // （小さい音はほぼそのまま通り、1.0付近を超える分だけ自然に丸められる）
    const pre = ctx.createGain(); pre.gain.value = 0.25;
    const shaper = ctx.createWaveShaper();
    const N = 4096, curve = new Float32Array(N);
    for(let i=0;i<N;i++){ const u = i/(N-1)*2 - 1; curve[i] = 0.95 * Math.tanh(u*4); } // 上限0.95で余裕を持たせる
    shaper.curve = curve; shaper.oversample = 'none'; // oversampleするとオーバーシュートで1.0を超えることがある
    master = ctx.createGain();
    master.gain.value = volumeGain();
    master.connect(pre); pre.connect(shaper); shaper.connect(ctx.destination);

    const conv = ctx.createConvolver();
    conv.buffer = makeImpulse(2.8, 2.6);
    revBus = ctx.createGain(); revBus.gain.value = 1;
    revBus.connect(conv); conv.connect(master);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
    return true;
  }
  function unlock(){
    if(!init()) return;
    if(ctx.state==='suspended') ctx.resume();
  }
  function applyVolume(){
    if(master) master.gain.setTargetAtTime(volumeGain(), ctx.currentTime, 0.02);
  }

  /* ---- 基本の音色 ---- */
  function tone(o){
    const t0 = ctx.currentTime + (o.at||0);
    const dur = o.dur;
    const atk = o.atk==null ? 0.006 : Math.min(o.atk, dur*0.9);
    const peak = o.gain==null ? 0.15 : o.gain;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    if(o.detune) osc.detune.value = o.detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    if(o.sustain){
      const rel = Math.min(o.rel==null ? dur*0.4 : o.rel, dur - atk);
      g.gain.setValueAtTime(peak, t0 + dur - rel);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let src = osc;
    if(o.lp){
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp;
      osc.connect(f); src = f;
    }
    src.connect(g);
    g.connect(master);
    if(o.rev){ const s = ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(revBus); }
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  // ベル：非整数倍音を重ねた金属的な響き
  function bell(freq, at, dur, gain, rev){
    const parts = [[1,1.0,1.0],[2.0,0.5,0.6],[2.76,0.35,0.45],[5.4,0.2,0.25],[8.93,0.1,0.15]];
    parts.forEach(([ratio, amp, decayScale])=>{
      if(freq*ratio > 18000) return;
      tone({ freq:freq*ratio, at, dur:dur*decayScale, gain:gain*amp, atk:0.003, rev });
    });
  }
  function noise(o){
    const t0 = ctx.currentTime + (o.at||0);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.freq || 2000, t0);
    if(o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + o.dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    const atk = o.atk || 0.005;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(master);
    if(o.rev){ const s = ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(revBus); }
    src.start(t0); src.stop(t0 + o.dur + 0.05);
  }
  function timpani(at, gain){
    tone({ freq:150, to:62, at, dur:0.9, gain:gain, atk:0.004, rev:0.35 });
    tone({ freq:75, to:50, at, dur:1.2, gain:gain*0.8, atk:0.004, rev:0.3 });
    noise({ at, dur:0.09, gain:gain*0.5, type:'lowpass', freq:900, rev:0.2 });
  }
  // オルガン風の和音：基音＋倍音をゆっくり立ち上げて響かせる
  function organ(freqs, at, dur, gain, rev){
    freqs.forEach(f=>{
      const rel = Math.min(2.2, dur*0.5);

function applyTheme(animate){
  const root = document.documentElement;
  if(animate){
    root.classList.add('theme-fade');
    setTimeout(()=> root.classList.remove('theme-fade'), 1400);
  }
  if(store.darkMode) root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
}
function setDarkMode(on, animate){
  store.darkMode = !!on;
  saveStore();
  applyTheme(animate!==false);
}
function recordKey(mode, range){ return mode+':'+range; }
function getBestStreak(mode, range){
  const rec = store.records[recordKey(mode,range)];
  return (rec && rec.bestStreak) ? rec.bestStreak : 0;
}
function maybeUpdateBestStreak(mode, range, streak){
  const key = recordKey(mode,range);
  if(!store.records[key]) store.records[key] = {};
  if(!store.records[key].bestStreak || streak>store.records[key].bestStreak){
    store.records[key].bestStreak = streak;
    saveStore();
    return true;
  }
  return false;
}
function getBestTimeAttack(range){
  return store.records[recordKey('timeattack',range)] || null;
}
function maybeUpdateBestTimeAttack(range, timeMs, mistakes){
  const key = recordKey('timeattack', range);
  const rec = store.records[key];
  if(!rec || timeMs < rec.bestTimeMs){
    store.records[key] = { bestTimeMs:timeMs, bestMistakes:mistakes };
    saveStore();
    return true;
  }
  return false;
}
function resetTimeAttackBest(range){
  delete store.records[recordKey('timeattack', range)];
  if(Array.isArray(store.rankingLog)){
    store.rankingLog = store.rankingLog.filter(e=>
      !(e.mode==='timeattack' && e.range===range && e.nickname===store.nickname)
    );
  }
  saveStore();
  deleteFirestoreRankingEntries('timeattack', range); // 完了を待たずに実行（失敗してもローカルの記録は消えている）
}

async function deleteFirestoreRankingEntries(mode, range){
  if(!window.db) return;
  try{
    const snap = await window.db.collection(FIRESTORE_COLLECTIONS[mode])
      .where('nickname','==', store.nickname)
      .where('range','==', range)
      .get();
    if(snap.empty) return;
    const batch = window.db.batch();
    snap.forEach(doc=> batch.delete(doc.ref));
    await batch.commit();
  }catch(err){
    console.warn('ランキングの削除に失敗しました（ローカルの記録は削除済みです）', err);
  }
}

const toastQueue = [];

function showToast(title, variant, desc){
  toastQueue.push({ title, variant, desc });
  if(!toastBusy) nextToast();
}
function nextToast(){
  const el = document.getElementById('toast');
  if(!el){ toastQueue.length = 0; toastBusy = false; return; }
  if(!toastQueue.length){ toastBusy = false; return; }
  toastBusy = true;
  const master = document.getElementById('masterOverlay');
  if(master && !master.hidden){ setTimeout(nextToast, 600); return; } // 元素マスター演出中は待つ
  const item = toastQueue.shift();
  el.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'toast-title'; t.textContent = item.title;
  el.appendChild(t);
  if(item.desc){
    const d = document.createElement('div');
    d.className = 'toast-desc'; d.textContent = item.desc;
    el.appendChild(d);
  }
  el.classList.toggle('secret', item.variant==='secret');
  el.hidden = false;
  requestAnimationFrame(()=> el.classList.add('show'));
  const stay = toastQueue.length ? 2300 : 3800;
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ el.hidden = true; nextToast(); }, 320);
  }, stay);
}

// 元素ごとの正誤履歴（苦手・得意の判定と、出題の重み付けに使う）
function recordElementResult(n, correct){
  if(!store.elementStats) store.elementStats = {};
  const s = store.elementStats[n] || { correct:0, wrong:0 };
  if(correct) s.correct++; else s.wrong++;
  store.elementStats[n] = s;
  saveStore();
  checkMasteryAchievements();
}
function elementWeight(e){
  const s = (store.elementStats && store.elementStats[e.n]) || { correct:0, wrong:0 };
  const total = s.correct + s.wrong;
  if(total===0) return 3; // 未挑戦の元素は多めに出す
  const acc = s.correct/total;
  return Math.max(0.4, 1.6 - acc*1.4); // 正答率が低いほど出やすい
}
// 習熟度＝正答率 × 信頼度（正解数が5回に達するまで徐々に頭打ちになる）。
// こうすることで、間違いを重ねながら回数だけこなしても習熟度は上がらず、
// 同時に「1問だけたまたま正解」も過大評価しない。
const MASTERY_CONFIDENCE_CAP = 5;
const MASTERY_THRESHOLD = 80;
function masteryPercent(n){
  const s = (store.elementStats && store.elementStats[n]) || { correct:0, wrong:0 };
  const total = s.correct + s.wrong;
  if(total===0) return 0;
  const acc = s.correct/total;
  const confidence = Math.min(1, s.correct/MASTERY_CONFIDENCE_CAP);
  return Math.round(acc * confidence * 100);
}
function getMasteredCount(){
  let count = 0;
  ELEMENTS.forEach(e=>{ if(masteryPercent(e.n) >= MASTERY_THRESHOLD) count++; });
  return count;
}
// 全体の習得度＝118元素それぞれの習熟度(masteryPercent)の平均
function overallMasteryRaw(){
  let sum = 0;
  ELEMENTS.forEach(e=>{ sum += masteryPercent(e.n); });
  return sum / ELEMENTS.length;
}
function overallMasteryPercent(){ return Math.round(overallMasteryRaw()); }
const OVERALL_MASTERY_TIERS = [[10,'overall10'],[25,'overall25'],[50,'overall50'],[75,'overall75'],[90,'overall90'],[100,'overall100']];
function checkMasteryAchievements(){
  const overall = overallMasteryPercent();
  // 元素マスターの演出を最優先で出す（同時に解除される他の実績のトーストは、演出が終わってから順番に出る）
  if(overall>=100) unlockAchievement('overall100');
  const count = getMasteredCount();
  if(count>=10) unlockAchievement('masterCount10');
  if(count>=30) unlockAchievement('masterCount30');
  if(count>=60) unlockAchievement('masterCount60');
  if(count>=100) unlockAchievement('masterCount100');
  if(count>=118) unlockAchievement('masterCount118');
  OVERALL_MASTERY_TIERS.forEach(([threshold, id])=>{ if(overall>=threshold) unlockAchievement(id); });
}
function getWeakElements(limit){
  const stats = store.elementStats || {};
  const rows = Object.keys(stats).map(nStr=>{
    const n = +nStr, s = stats[nStr], total = s.correct+s.wrong;
    return { n, total, acc: total ? s.correct/total : 0 };
  }).filter(r=> r.total>=2 && r.acc<0.7);
  rows.sort((a,b)=> a.acc-b.acc || b.total-a.total);
  return rows.slice(0,limit).map(r=> ELEMENTS.find(e=>e.n===r.n)).filter(Boolean);
}
function applyMasteryOverlay(){
  const stats = store.elementStats || {};
  cellByNum.forEach((div,n)=>{
    div.classList.remove('mastered','weak');
    const liquidEl = div.querySelector('.liquid');
    if(div.classList.contains('locked')){
      if(liquidEl) liquidEl.style.height = '0%';
      return;
    }
    const pct = masteryPercent(n);
    if(liquidEl) liquidEl.style.height = pct+'%';
    const s = stats[n];
    const total = s ? s.correct+s.wrong : 0;
    if(total<2) return;
    const acc = s.correct/total;
    if(pct>=MASTERY_THRESHOLD) div.classList.add('mastered');
    else if(acc<0.5) div.classList.add('weak');
  });
}

function escapeHtml(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function saveLocalRankingEntry(entry){
  if(!Array.isArray(store.rankingLog)) store.rankingLog = [];
  store.rankingLog.push(entry);
  if(store.rankingLog.length>500) store.rankingLog = store.rankingLog.slice(-500);
  saveStore();
}

function filterByPeriod(entries, period){
  if(period==='all') return entries;
  const now = new Date();
  const todayStr = now.toDateString();
  const monthKey = now.getFullYear()+'-'+now.getMonth();
  return entries.filter(e=>{
    const d = new Date(e.ts);
    if(period==='today') return d.toDateString()===todayStr;
    if(period==='month') return (d.getFullYear()+'-'+d.getMonth())===monthKey;
    return true;
  });
}

// entries は事前に「良い順」に並んでいる前提。各ニックネームについて
// 最初に出てきたもの（＝そのニックネームのベスト）だけを残す。
function dedupeBestPerNickname(entries){
  const seen = new Set();
  const result = [];
  entries.forEach(e=>{
    if(seen.has(e.nickname)) return;
    seen.add(e.nickname);
    result.push(e);
  });
  return result;
}

function getLocalRanking(mode, range, period){
  const log = (store.rankingLog||[]).filter(e=> e.mode===mode && e.range===range);
  const filtered = filterByPeriod(log, period);
  const sorted = filtered.slice().sort((a,b)=>{
    return mode==='timeattack' ? (a.timeMs - b.timeMs) : (b.score - a.score);
  });
  return dedupeBestPerNickname(sorted).slice(0,20);
}

async function submitScore(mode, range, payload){
  const entry = Object.assign({ nickname: store.nickname||'名無し', mode, range, level: levelForXp(store.xp||0), ts: Date.now() }, payload);
  saveLocalRankingEntry(entry); // オフライン時の保険として端末内にも残す
  if(window.db){
    try{
      const { mode:_omit, ...data } = entry; // Firestore側はコレクション名でモードを表すので除く
      await window.db.collection(FIRESTORE_COLLECTIONS[mode]).add(data);
    }catch(err){ console.warn('スコアの送信に失敗しました（ローカルには記録済みです）', err); }
  }
}

async function fetchRanking(mode, range, period){
  if(window.db){
    try{
      const sortField = mode==='exam' ? 'score' : 'timeMs';
      const sortDir = mode==='exam' ? 'desc' : 'asc';
      // range の絞り込みは意図的にクエリではなくJS側で行う。
      // where(range==)+orderBy(別フィールド) の組み合わせはFirestoreの複合インデックスが
      // 必要になり、未作成だと結果が0件になってしまうため（エラーはconsoleに出るのみ）。
      const snap = await window.db.collection(FIRESTORE_COLLECTIONS[mode])
        .orderBy(sortField, sortDir)
        .limit(500)
        .get();
      const all = snap.docs.map(d=>d.data()).filter(e=>e.range===range);
      const periodFiltered = filterByPeriod(all, period); // orderBy済みなので順序は保たれる
      return { entries: dedupeBestPerNickname(periodFiltered).slice(0,20), source:'firestore' };
    }catch(err){
      console.warn('ランキングの取得に失敗しました。ローカル記録を表示します。', err);
      return { entries: getLocalRanking(mode, range, period), source:'error' };
    }
  }
  return { entries: getLocalRanking(mode, range, period), source:'local' };
}

function renderRankingRows(mode, entries){

    const scoreText = mode==='timeattack'
      ? `${formatTime(e.timeMs)}（ミス${e.mistakes}）`
      : `${e.score}/${e.total}`;
    const dateText = new Date(e.ts).toLocaleString('ja-JP', {
      timeZone: 'Asia/Tokyo', year:'numeric', month:'2-digit', day:'2-digit',

    return `<tr class="${isMe?'me':''}"><td>${i+1}</td><td>${escapeHtml(e.nickname)}${levelTag}</td><td>${scoreText}</td><td>${dateText}</td></tr>`;
  }).join('');
}

function normalizeSymbol(raw){
  let s = (raw||'').trim().replace(/[\u3000\s]+/g,'');
  if(!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}
function toKatakana(str){
  return (str||'').replace(/[\u3041-\u3096]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}
function normalizeJP(str){
  return toKatakana((str||'').trim().replace(/[\u3000\s]+/g,''));
}
function acceptableNameAnswers(e){
  const set = new Set();
  set.add(normalizeJP(e.name));
  const readings = ELEMENT_READINGS[e.n];
  if(readings) readings.forEach(r=> set.add(normalizeJP(r)));
  return set;
}
function checkFkEasterEgg(raw){
  if((raw||'').trim().toLowerCase()==='fk') unlockAchievement('fkEasterEgg');
}
const SUBSCRIPT_DIGITS = { '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9' };
function normalizeFormula(str){
  return (str||'')
    .split('').map(ch=> SUBSCRIPT_DIGITS[ch] || ch).join('')
    .toLowerCase()
    .replace(/[^a-z0-9]/g,''); // 空白・括弧・カンマなどを無視し、緩めに判定する
}

function describePosition(e){
  if(e.row<=7) return `第${e.row}周期・${e.col}族`;
  if(e.row===9) return 'ランタノイド';
  return 'アクチノイド';
}

function pickRandomElement(excludeN){
  const pool = state.activeElements.filter(e=>e.n!==excludeN);
  const src = pool.length ? pool : state.activeElements;
  const weights = src.map(elementWeight);
  const total = weights.reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  for(let i=0;i<src.length;i++){
    r -= weights[i];
    if(r<=0) return src[i];
  }
  return src[src.length-1];
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function formatTime(ms){
  const totalSec = Math.max(0,ms)/1000;
  const m = Math.floor(totalSec/60);
  const s = (totalSec%60).toFixed(1).padStart(4,'0');
  return `${m}:${s}`;
}

async function copyToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(err){ /* フォールバックへ */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(err){
    return false;
  }
}

function switchMode(mode){
  if(state.mode==='timeattack') stopTimer();
  state.mode = mode;
  document.body.dataset.mode = mode;
  setActiveTab(mode);
  clearFeedback();
  resetCellVisuals();
  const rankingOverlay = document.getElementById('rankingOverlay');
  if(rankingOverlay) rankingOverlay.hidden = true;
  const achievementsOverlay = document.getElementById('achievementsOverlay');

  if(mode==='home') startHome();
  else if(mode==='timeattack') startTimeAttack();
  else if(mode==='exam') startExam();
  else beginQuestionKind(mode);
}

function beginQuestionKind(kind){
  if(kind==='position') beginPositionQuestion();
  else if(kind==='type') beginTypeQuestion();
  else if(kind==='match') beginMatchQuestion();
  else if(kind==='group') beginGroupQuestion();
  else if(kind==='trend') beginTrendQuestion();
  else if(kind==='trivia') beginTriviaQuestion();
  else if(kind==='swap') beginSwapQuestion();
}

function startExam(){
  state.stats.exam = { correct:0, total:0, streak:0, best:getBestStreak('exam', state.range) };
  advanceQuestion();
}

function advanceQuestion(){
  resetCellVisuals();
  clearFeedback();
  if(state.mode==='exam'){
    if(state.stats.exam.total >= EXAM_TOTAL_QUESTIONS){ finishExamSession(); return; }
    const kind = QUESTION_KINDS[Math.floor(Math.random()*QUESTION_KINDS.length)];
    beginQuestionKind(kind);
  } else {
    beginQuestionKind(state.mode);
  }
}

function finishExamSession(){
  const s = state.stats.exam;
  submitScore('exam', state.range, { score:s.correct, total:EXAM_TOTAL_QUESTIONS });
  awardXp(30);
  Sound.play('fanfare');
  unlockAchievement('exam'+state.range);
  if(s.correct===EXAM_TOTAL_QUESTIONS) unlockAchievement('perfectExam');
  const acc = Math.round(s.correct/EXAM_TOTAL_QUESTIONS*100);
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">本番 終了！</div>
    <p class="prompt-text">${EXAM_TOTAL_QUESTIONS}問中 <strong>${s.correct}</strong> 問正解でした（正答率 ${acc}%）</p>
  `;
  controls.innerHTML = `
    <button class="btn btn-primary" id="examAgainBtn" type="button">もう一度</button>
  `;
  document.getElementById('examAgainBtn').addEventListener('click', startExam);
  clearFeedback();
  updateStatusBar();
}

}

function handlePositionAnswer(clicked){
  if(state.busy) return;
  state.busy = true;
  const target = state.current.target;
  const stats = state.stats[state.mode];
  stats.total++;
  if(clicked.n === target.n){
    const div = cellByNum.get(clicked.n);
    div.classList.add('show-label','correct');
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    recordElementResult(target.n, true);
    onCorrectAnswer(10, stats.streak);
    setFeedback('正解！', 'good');
    scheduleNext(()=>advanceQuestion(), 800);
  } else {
    const wrongDiv = cellByNum.get(clicked.n);
    const correctDiv = cellByNum.get(target.n);
    wrongDiv.classList.add('show-label','wrong');
    correctDiv.classList.add('show-label','reveal');
    stats.streak = 0;
    recordElementResult(target.n, false);
    setFeedback(`不正解。正しい位置は点線の枠です（${describePosition(target)}）`, 'bad');
    scheduleNext(()=>advanceQuestion(), 1700);
  }
  updateStatusBar();
}
function skipPosition(){
  if(state.busy) return;
  state.busy = true;

  cellByNum.get(target.n).classList.add('show-label','reveal');
  setFeedback(`位置は ${describePosition(target)} です`, 'neutral');
  scheduleNext(()=>advanceQuestion(), 1500);
}

/* =========================================================
   13. 問題種別 4：仲間さがし（白紙のマスに記号を書く・自動送り）
   ========================================================= */

function beginGroupQuestion(){
  let category=null, members=[];
  for(let attempt=0; attempt<8; attempt++){
    const prevCat = state.current && state.current.category ? state.current.category : null;
    const pool = GROUP_MODE_CATEGORIES.filter(c=>c!==prevCat);
    const candidatePool = pool.length ? pool : GROUP_MODE_CATEGORIES;
    category = candidatePool[Math.floor(Math.random()*candidatePool.length)];
    members = state.activeElements.filter(e=>e.cat===category).sort((a,b)=>a.n-b.n);
    if(members.length>0) break;
  }
  if(!members.length){ beginPositionQuestion(); return; }

  setDefaultLabels(false);
  members.forEach(m=> cellByNum.get(m.n).classList.add('candidate'));
  state.current = { kind:'group', category, members, filled:new Set(), selected:null, mistakes:0 };

  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">仲間さがし</div>
    <p class="prompt-text">青い枠は<strong>${CATEGORY_LABEL_JP[category]}</strong>の元素です。オレンジの枠のマスから順に、元素記号を入力してください。（残り <span id="groupRemaining">${members.length}</span> 個）</p>
  `;
  controls.innerHTML = `
    <div class="field-row">
      <input type="text" id="groupInput" class="text-input" placeholder="元素記号" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="3">
      <button class="btn btn-primary" id="groupSubmitBtn" type="button">入力</button>
    </div>
    <button class="btn btn-ghost" id="groupGiveUpBtn" type="button">あきらめて答えを見る</button>
  `;
  document.getElementById('groupSubmitBtn').addEventListener('click', submitGroupAnswer);
  document.getElementById('groupInput').addEventListener('keydown', ev=>{ if(ev.key==='Enter') submitGroupAnswer(); });
  document.getElementById('groupGiveUpBtn').addEventListener('click', giveUpGroup);

  selectGroupCell(members[0]);
  updateStatusBar();
}
function selectGroupCell(e){
  const cur = state.current;
  if(cur.selected) cellByNum.get(cur.selected.n).classList.remove('target');
  cur.selected = e;
  const div = cellByNum.get(e.n);
  div.classList.remove('candidate');
  div.classList.add('target');
  const input = document.getElementById('groupInput');
  const btn = document.getElementById('groupSubmitBtn');
  if(input){ input.disabled=false; input.value=''; input.focus(); }
  if(btn) btn.disabled=false;
  clearFeedback();
}
function handleGroupTap(e){
  const cur = state.current;
  const isMember = cur.members.some(m=>m.n===e.n);
  if(!isMember || cur.filled.has(e.n)) return; // 対象外、または既に完了したマスは無視
  selectGroupCell(e);
}
function submitGroupAnswer(){
  const cur = state.current;
  if(!cur.selected) return;
  const input = document.getElementById('groupInput');
  checkFkEasterEgg(input.value);
  const val = normalizeSymbol(input.value);
  const target = cur.selected;
  const div = cellByNum.get(target.n);

  if(val === target.sym){
    div.classList.add('show-label','correct','filled');
    div.classList.remove('target');
    cur.filled.add(target.n);
    cur.selected = null;
    recordElementResult(target.n, true);
    awardXp(5);
    const span = document.getElementById('groupRemaining');
    if(span) span.textContent = cur.members.length - cur.filled.size;
    clearFeedback();
    if(cur.filled.size === cur.members.length){ finishGroupRound(true); return; }
    Sound.play('fill', cur.filled.size / cur.members.length);
    const next = cur.members.find(m=>!cur.filled.has(m.n));
    if(next) selectGroupCell(next);
  } else {
    cur.mistakes++;
    div.classList.add('wrong');
    recordElementResult(target.n, false);
    setTimeout(()=>div.classList.remove('wrong'), 350);
    setFeedback('不正解。もう一度入力してください', 'bad');
    input.value=''; input.focus();
  }
}
function giveUpGroup(){
  if(state.busy) return;
  state.busy = true;
  const cur = state.current;
  cur.members.forEach(m=>{
    if(!cur.filled.has(m.n)){
      const div = cellByNum.get(m.n);
      div.classList.remove('candidate','target');
      div.classList.add('show-label','reveal');
    }
  });
  finishGroupRound(false);
}
function finishGroupRound(success){
  state.busy = true;
  const cur = state.current;
  const stats = state.stats[state.mode];
  stats.total++;
  if(success){
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    onCorrectAnswer(10, stats.streak);
    if(cur.mistakes===0) unlockAchievement('perfectGroup');
    setFeedback(cur.mistakes===0 ? 'パーフェクト！全部書けました！' : `全部書けました（ミス${cur.mistakes}回）`, 'good');
  } else {
    stats.streak = 0;
    setFeedback('正解を表示しました', 'bad');
  }
  updateStatusBar();
  scheduleNext(()=>advanceQuestion(), success?1200:1900);
}

/* =========================================================
   14. 問題種別 5：その他問題（周期表の傾向・電子配置・反応）
   ========================================================= */

function orbitalBlock(e){
  if(e.cat==='lanth' || e.cat==='act') return 'f';
  if(e.n===2 || e.col<=2) return 's';
  if(e.col>=3 && e.col<=12) return 'd';
  return 'p';
}

function generateGroupTrend(){
  const prop = TREND_PROPERTIES[Math.floor(Math.random()*TREND_PROPERTIES.length)];
  const cols = prop.cols;
  const col = cols[Math.floor(Math.random()*cols.length)];
  const groupDef = TREND_GROUPS[col];
  let candidates = state.activeElements.filter(groupDef.filter);
  if(candidates.length<2) return null;
  candidates.sort((a,b)=>a.row-b.row);
  if(candidates.length>5){
    const first=candidates[0], last=candidates[candidates.length-1];
    const middle = shuffle(candidates.slice(1,-1)).slice(0,3);
    candidates = [first,...middle,last].sort((a,b)=>a.row-b.row);
  }
  const direction = Math.random()<0.5 ? 'max' : 'min';
  const rows = candidates.map(c=>c.row);
  let wantRow;
  if(prop.bigRowIsBig) wantRow = direction==='max' ? Math.max(...rows) : Math.min(...rows);
  else wantRow = direction==='max' ? Math.min(...rows) : Math.max(...rows);
  const answer = candidates.find(c=>c.row===wantRow);
  return { uiType:'tap', groupLabel:groupDef.label, property:prop, direction, candidates, answer };
}

function generateSamePeriodTrend(){
  for(let attempt=0; attempt<10; attempt++){
    const period = 2 + Math.floor(Math.random()*5); // 第2〜6周期（第1周期はH,Heのみで比較しづらいため除外）
    let candidates = state.activeElements.filter(e=> e.row===period && SAME_PERIOD_SAFE_GROUPS.includes(e.col));
    if(candidates.length<2) continue;
    candidates.sort((a,b)=>a.col-b.col);
    const direction = Math.random()<0.5 ? 'max' : 'min';
    const cols = candidates.map(c=>c.col);
    // 1・2・16・17・18族だけを使うことで13〜15族付近の例外を跨がないため、
    // 「族が右にあるほどイオン化エネルギーは大きい」という単純な傾向がそのまま安全に成り立つ。
    const wantCol = direction==='max' ? Math.max(...cols) : Math.min(...cols);
    const answer = candidates.find(c=>c.col===wantCol);
    return { uiType:'tap', groupLabel:`第${period}周期`, property:{label:'第一イオン化エネルギー'}, direction, candidates, answer };
  }
  return null;
}

function generateOrbitalQuestion(){
  const target = pickRandomElement(null);
  if(!target) return null;
  return { uiType:'orbital', target, correctBlock: orbitalBlock(target) };
}

function generateReactionQuestion(list, variant){
  const inRange = list.filter(r=> state.activeElements.some(e=>e.n===r.askN));
  if(!inRange.length) return null;
  const r = inRange[Math.floor(Math.random()*inRange.length)];
  const displayText = reactionMaskedText(r);
  if(variant==='formula'){
    return { uiType:'formula', reactionText:displayText, question:r.productQuestion, answerFormula:r.product };
  }
  const answerElement = ELEMENTS.find(e=>e.n===r.askN);
  return { uiType:'reaction', reactionText:displayText, question:r.question, answerElement };
}

function generateTrendQuestion(){
  const templates = ['group','sameperiod','orbital','acidbase','redox'];
  for(let attempt=0; attempt<15; attempt++){
    const template = templates[Math.floor(Math.random()*templates.length)];
    let q = null;
    if(template==='group') q = generateGroupTrend();
    else if(template==='sameperiod') q = generateSamePeriodTrend();
    else if(template==='orbital') q = generateOrbitalQuestion();
    else if(template==='acidbase') q = generateReactionQuestion(ACID_BASE_REACTIONS, Math.random()<0.5?'element':'formula');
    else if(template==='redox') q = generateReactionQuestion(REDOX_REACTIONS, Math.random()<0.5?'element':'formula');
    if(q) return q;
  }
  return null;
}
function clearTrendHighlights(){
  document.querySelectorAll('.cell.candidate').forEach(d=>d.classList.remove('candidate'));
}
function beginTrendQuestion(){
  setDefaultLabels(true);
  const q = generateTrendQuestion();
  if(!q){ beginPositionQuestion(); return; }
  state.current = { kind:'trend', q };

  if(q.uiType==='tap'){
    q.candidates.forEach(c=> cellByNum.get(c.n).classList.add('candidate'));
    const dirLabel = q.direction==='max' ? '最も大きい' : '最も小さい';
    promptPanel.innerHTML = `
      <div class="prompt-eyebrow">周期表の傾向</div>
      <p class="prompt-text">${q.groupLabel}のうち、周期表の位置関係から考えて<strong>${q.property.label}が${dirLabel}</strong>と考えられる元素を、青い枠の中からタップしてください。</p>
    `;
    controls.innerHTML = `<button class="btn btn-ghost" id="trendSkipBtn" type="button">スキップ（答えを見る）</button>`;
    document.getElementById('trendSkipBtn').addEventListener('click', skipTrendQuestion);
  } else if(q.uiType==='orbital'){
    renderTextAnswerUI(`
      <div class="prompt-eyebrow">電子配置</div>
      <div class="element-card">
        <span class="element-card-sym">${q.target.sym}</span>
        <span class="element-card-name">${q.target.name}</span>
      </div>
      <p class="prompt-text">この元素は s, p, d, f ブロックのどれに属する？</p>
    `, handleOrbitalAnswer, {placeholder:'s / p / d / f', maxlength:1});
  } else if(q.uiType==='reaction'){
    renderTextAnswerUI(`
      <div class="prompt-eyebrow">代表的な反応</div>
      <p class="prompt-text">${q.reactionText}</p>
      <p class="prompt-text">${q.question}</p>
    `, handleReactionAnswer, {placeholder:'元素記号 or 名前', maxlength:16, wide:true});
  } else if(q.uiType==='formula'){
    renderTextAnswerUI(`
      <div class="prompt-eyebrow">代表的な反応</div>
      <p class="prompt-text">${q.reactionText}</p>
      <p class="prompt-text">${q.question}</p>
      <p class="prompt-text fact">括弧や下付き数字は普通の数字でもOKです（例: CaCl2 でも CaCl₂ でも正解）。</p>
    `, handleFormulaAnswer, {placeholder:'例: NaCl', maxlength:20, wide:true});
  }
  updateStatusBar();
}
function handleTrendTap(e){
  if(state.busy) return;
  const cur = state.current;
  if(!cur.q || cur.q.uiType!=='tap') return;
  const isCandidate = cur.q.candidates.some(c=>c.n===e.n);
  if(!isCandidate){ failTrend(); return; }
  if(e.n===cur.q.answer.n) succeedTrend(e);
  else failTrend();
}
function succeedTrend(e){
  state.busy = true;
  clearTrendHighlights();
  cellByNum.get(e.n).classList.add('correct');
  const stats = state.stats[state.mode];
  stats.total++; stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
  maybeUpdateBestStreak(state.mode, state.range, stats.streak);
  recordElementResult(e.n, true);
  onCorrectAnswer(12, stats.streak);
  setFeedback('正解！', 'good');
  updateStatusBar();
  scheduleNext(()=>advanceQuestion(), 900);
}
function failTrend(){
  state.busy = true;
  const cur = state.current;
  clearTrendHighlights();
  cellByNum.get(cur.q.answer.n).classList.add('show-label','reveal');
  const stats = state.stats[state.mode];
  stats.total++; stats.streak=0;
  recordElementResult(cur.q.answer.n, false);
  setFeedback(`不正解。正解は ${cur.q.answer.sym}（${cur.q.answer.name}）でした`, 'bad');
  updateStatusBar();
  scheduleNext(()=>advanceQuestion(), 1900);
}

function beginSwapQuestion(){
  const pool = shuffle(state.activeElements);
  if(pool.length<2){ beginPositionQuestion(); return; }
  const a = pool[0], b = pool[1];
  state.current = { kind:'swap', a, b };
  setDefaultLabels(true);

  const divA = cellByNum.get(a.n), divB = cellByNum.get(b.n);
  const symA = divA.querySelector('.sym'), symB = divB.querySelector('.sym');
  if(symA) symA.textContent = b.sym;
  if(symB) symB.textContent = a.sym;

  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">入れ替わりさがし</div>
    <p class="prompt-text">周期表の中で、<strong>2つの元素の記号が入れ替わっています</strong>。おかしいと思うマスをどちらかタップしてください。</p>
  `;
  controls.innerHTML = `<button class="btn btn-ghost" id="swapSkipBtn" type="button">スキップ（答えを見る）</button>`;
  document.getElementById('swapSkipBtn').addEventListener('click', skipSwap);
  updateStatusBar();
}
// 表示だけを入れ替えているため、次の問題に進む前に必ず元へ戻す（呼び忘れ対策でresetCellVisualsからも呼ばれる）
function restoreSwap(){
  const cur = state.current;
  if(!cur || cur.kind!=='swap') return;
  const divA = cellByNum.get(cur.a.n), divB = cellByNum.get(cur.b.n);
  const symA = divA && divA.querySelector('.sym');
  const symB = divB && divB.querySelector('.sym');
  if(symA) symA.textContent = cur.a.sym;
  if(symB) symB.textContent = cur.b.sym;
}
function handleSwapAnswer(clicked){
  if(state.busy) return;
  state.busy = true;
  const cur = state.current;
  const stats = state.stats[state.mode];
  stats.total++;
  const isHit = clicked.n===cur.a.n || clicked.n===cur.b.n;
  restoreSwap();
  if(isHit){
    cellByNum.get(cur.a.n).classList.add('correct');
    cellByNum.get(cur.b.n).classList.add('correct');
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    recordElementResult(cur.a.n, true); recordElementResult(cur.b.n, true);
    onCorrectAnswer(12, stats.streak);
    setFeedback('正解！入れ替わりに気づきましたね。', 'good');
    scheduleNext(()=>advanceQuestion(), 900);
  } else {
    cellByNum.get(clicked.n).classList.add('wrong');
    cellByNum.get(cur.a.n).classList.add('reveal');
    cellByNum.get(cur.b.n).classList.add('reveal');
    stats.streak = 0;
    recordElementResult(cur.a.n, false); recordElementResult(cur.b.n, false);
    setFeedback(`不正解。入れ替わっていたのは ${cur.a.sym} と ${cur.b.sym} でした`, 'bad');
    scheduleNext(()=>advanceQuestion(), 1900);
  }
  updateStatusBar();
}
function skipSwap(){
  if(state.busy) return;
  state.busy = true;
  const cur = state.current;
  restoreSwap();
  cellByNum.get(cur.a.n).classList.add('show-label','reveal');
  cellByNum.get(cur.b.n).classList.add('show-label','reveal');
  setFeedback(`入れ替わっていたのは ${cur.a.sym} と ${cur.b.sym} でした`, 'neutral');
  scheduleNext(()=>advanceQuestion(), 1800);
}

/* =========================================================
   15. タイムアタック
   ========================================================= */

function stopTimer(){
  if(state.timeAttack.timerId){ clearInterval(state.timeAttack.timerId); state.timeAttack.timerId = null; }
  state.timeAttack.running = false;
}
function startTimeAttack(){
  clearTimeout(state.pendingTimeout); state.busy=false;
  stopTimer();
  resetCellVisuals();
  clearFeedback();
  state.timeAttack = { running:false, startTs:0, mistakes:0, filled:new Set(), selected:null, timerId:null, lastResult:null };
  setDefaultLabels(false);

  const best = getBestTimeAttack(state.range);
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">真っ白周期表埋めタイムアタック</div>
    <p class="prompt-text">「スタート」を押すと計測開始。マスをタップして元素記号を入力し、選んだ範囲を全部埋めるまでのタイムを競います。正解すると自動的に次のマスが選ばれます。</p>
    ${best ? `<p class="prompt-text fact">自己ベスト：${formatTime(best.bestTimeMs)}（ミス${best.bestMistakes}）</p>` : ''}
  `;
  controls.innerHTML = `<button class="btn btn-primary" id="taStartBtn" type="button">スタート</button>`;
  document.getElementById('taStartBtn').addEventListener('click', beginTimeAttackTimer);
  renderTimeAttackStatus();
}
function beginTimeAttackTimer(){
  state.timeAttack.running = true;
  state.timeAttack.startTs = performance.now();
  state.timeAttack.timerId = setInterval(renderTimeAttackStatus, 100);

  controls.innerHTML = `
    <div class="field-row">
      <input type="text" id="taInput" class="text-input" placeholder="マスをタップ" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="3" disabled>
      <button class="btn btn-primary" id="taSubmitBtn" type="button" disabled>入力</button>
    </div>
    <button class="btn btn-ghost" id="taResetBtn" type="button">リセット</button>
  `;
  document.getElementById('taSubmitBtn').addEventListener('click', submitTimeAttack);
  document.getElementById('taInput').addEventListener('keydown', ev=>{ if(ev.key==='Enter') submitTimeAttack(); });
  document.getElementById('taResetBtn').addEventListener('click', startTimeAttack);

  const firstElement = state.activeElements.find(e=>e.n===1) || state.activeElements[0];
  selectTimeAttackCell(firstElement);
  renderTimeAttackStatus();
}
function selectTimeAttackCell(e){
  const ta = state.timeAttack;
  if(ta.selected) cellByNum.get(ta.selected.n).classList.remove('target');
  ta.selected = e;
  cellByNum.get(e.n).classList.add('target');
  const input = document.getElementById('taInput');
  const btn = document.getElementById('taSubmitBtn');
  if(input){ input.disabled=false; input.value=''; input.focus(); }
  if(btn) btn.disabled=false;
  clearFeedback();
}
function handleTimeAttackSelect(e){
  const ta = state.timeAttack;
  if(!ta.running){ setFeedback('まず「スタート」を押してください', 'neutral'); return; }
  if(ta.filled.has(e.n)) return;
  selectTimeAttackCell(e);
}
function findNextUnfilled(afterN){
  const remaining = state.activeElements.filter(e=>!state.timeAttack.filled.has(e.n)).sort((a,b)=>a.n-b.n);
  if(!remaining.length) return null;
  return remaining.find(e=>e.n>afterN) || remaining[0];
}
function submitTimeAttack(){
  const ta = state.timeAttack;
  if(!ta.running || !ta.selected) return;
  const input = document.getElementById('taInput');
  checkFkEasterEgg(input.value);
  const val = normalizeSymbol(input.value);
  const target = ta.selected;
  const div = cellByNum.get(target.n);

  if(val === target.sym){
    div.classList.add('show-label','correct','filled');
    div.classList.remove('target');
    ta.filled.add(target.n);
    ta.selected = null;
    recordElementResult(target.n, true);
    awardXp(2);
    clearFeedback();
    if(ta.filled.size === state.activeElements.length){ finishTimeAttack(); return; }
    Sound.play('fill', ta.filled.size / state.activeElements.length);
    const next = findNextUnfilled(target.n);
    if(next) selectTimeAttackCell(next);
    renderTimeAttackStatus();
  } else {
    ta.mistakes++;
    div.classList.add('wrong');
    recordElementResult(target.n, false);
    setTimeout(()=>div.classList.remove('wrong'), 350);
    setFeedback('不正解。もう一度入力してください', 'bad');
    input.value=''; input.focus();
    renderTimeAttackStatus();
  }
}
function finishTimeAttack(){
  const ta = state.timeAttack;
  const elapsed = performance.now() - ta.startTs;
  stopTimer();
  ta.lastResult = { timeMs:elapsed, mistakes:ta.mistakes };
  const improved = maybeUpdateBestTimeAttack(state.range, elapsed, ta.mistakes);
  const best = getBestTimeAttack(state.range);
  submitScore('timeattack', state.range, { timeMs:elapsed, mistakes:ta.mistakes });
  awardXp(50);
  Sound.play('fanfare');

  unlockAchievement('ta'+state.range);

  const avgSecPerCell = (elapsed/1000) / state.activeElements.length;
  if(avgSecPerCell<=1.3) unlockAchievement('speedNormal1');
  if(avgSecPerCell<=1.1) unlockAchievement('speedNormal2');
  if(avgSecPerCell<=1.0) unlockAchievement('speedNormal3');
  if(avgSecPerCell<=0.9) unlockAchievement('speedI');
  if(avgSecPerCell<=0.8) unlockAchievement('speedII');
  if(avgSecPerCell<=0.7) unlockAchievement('speedIII');

  if(ta.mistakes===0){
    if(!Array.isArray(store.noMissRanges)) store.noMissRanges = [];
    if(!store.noMissRanges.includes(state.range)){
      store.noMissRanges.push(state.range);
      saveStore();
    }
    if(RANGES.every(r=> store.noMissRanges.includes(r.id))) unlockAchievement('allRangesNoMiss');
  }

  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">完了！${improved ? '　🎉 新記録！' : ''}</div>
    <p class="prompt-text">タイム <strong>${formatTime(elapsed)}</strong>　ミス <strong>${ta.mistakes}</strong> 回</p>
    ${best ? `<p class="prompt-text fact">自己ベスト：${formatTime(best.bestTimeMs)}（ミス${best.bestMistakes}）</p>` : ''}
  `;
  controls.innerHTML = `
    <button class="btn btn-primary" id="taAgainBtn" type="button">もう一度</button>
  `;
  document.getElementById('taAgainBtn').addEventListener('click', startTimeAttack);
  clearFeedback();
  renderTimeAttackStatus();
}
function renderTimeAttackStatus(){
  const ta = state.timeAttack;
  const elapsed = ta.running ? performance.now() - ta.startTs : 0;
  const total = state.activeElements.length;
  const best = getBestTimeAttack(state.range);
  statusBar.innerHTML = `
    <span class="stat">タイム <strong>${formatTime(elapsed)}</strong></span>
    <span class="stat">ミス <strong>${ta.mistakes}</strong></span>
    <span class="stat">${ta.filled.size} / ${total} 埋まった</span>
    ${best ? `<span class="stat">自己ベスト <strong>${formatTime(best.bestTimeMs)}</strong></span>` : ''}
    <button class="btn-text" id="taResetBestBtn" type="button">自己ベストをリセット</button>
    <button class="btn-text" id="shareBtn" type="button">結果をシェア</button>
  `;
  const resetBestBtn = document.getElementById('taResetBestBtn');
  if(resetBestBtn){
    resetBestBtn.addEventListener('click', ()=>{
      resetTimeAttackBest(state.range);
      if(state.timeAttack.running) renderTimeAttackStatus();
      else startTimeAttack(); // 開始前・終了後の画面は自己ベスト表示も含めて作り直す
    });
  }
  wireShareButton();
}

/* =========================================================
   16. セル共通クリック処理
   ========================================================= */

function onCellClick(e){
  const div = cellByNum.get(e.n);
  if(div.classList.contains('locked')) return;
  Sound.play('tap');

  if(state.mode==='home'){ showInfo(e); return; }
  if(state.mode==='timeattack'){ handleTimeAttackSelect(e); return; }

  const kind = state.current && state.current.kind;
  if(kind==='position') handlePositionAnswer(e);
  else if(kind==='group') handleGroupTap(e);
  else if(kind==='trend') handleTrendTap(e);
  else if(kind==='trivia') handleTriviaTap(e);
  else if(kind==='swap') handleSwapAnswer(e);
  // 'type' と 'match' のときはテーブルのクリックは無効
}

/* =========================================================
   17. スコア表示・結果シェア
   ========================================================= */

function updateStatusBar(){
  if(state.mode==='timeattack'){ renderTimeAttackStatus(); return; }
  const s = state.stats[state.mode];
  if(!s){ statusBar.innerHTML=''; return; }
  const acc = s.total ? Math.round(s.correct/s.total*100) : 0;
  const progressStat = state.mode==='exam' ? `<span class="stat">問題 <strong>${Math.min(s.total,EXAM_TOTAL_QUESTIONS)}</strong>/${EXAM_TOTAL_QUESTIONS}</span>` : '';
  statusBar.innerHTML = `
    ${progressStat}
    <span class="stat">正解 <strong>${s.correct}</strong>/${s.total}</span>
    <span class="stat">正答率 <strong>${acc}%</strong></span>
    <span class="stat">連続正解 <strong>${s.streak}</strong>（自己ベスト ${s.best}）</span>
    <button class="btn-text" id="resetStatsBtn" type="button">記録をリセット</button>
    <button class="btn-text" id="shareBtn" type="button">結果をシェア</button>
  `;
  const resetBtn = document.getElementById('resetStatsBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      state.stats[state.mode] = { correct:0, total:0, streak:0, best:getBestStreak(state.mode, state.range) };
      updateStatusBar();
    });
  }
  wireShareButton();
}
function wireShareButton(){
  const btn = document.getElementById('shareBtn');
  if(btn) btn.addEventListener('click', handleShareClick);
}
const SHARE_LINK = 'https://yms334.github.io/periodic_table/';
function buildShareText(){
  const nickname = store.nickname || '名無し';
  const rangeText = rangeSelect.options[rangeSelect.selectedIndex] ? rangeSelect.options[rangeSelect.selectedIndex].textContent : `〜${state.range}`;
  const modeLabel = MODE_LABELS[state.mode] || state.mode;

  if(state.mode==='timeattack'){
    const ta = state.timeAttack;
    const best = getBestTimeAttack(state.range);
    const lines = [`🧪周期表ドリル - ${modeLabel}`, `ニックネーム: ${nickname}`, `範囲: ${rangeText}`];
    if(ta.lastResult) lines.push(`タイム ${formatTime(ta.lastResult.timeMs)}（ミス${ta.lastResult.mistakes}）`);
    if(best) lines.push(`自己ベスト ${formatTime(best.bestTimeMs)}（ミス${best.bestMistakes}）`);
    if(!ta.lastResult && !best) lines.push('まだ記録がありません');
    lines.push(`挑戦はこちら → ${SHARE_LINK}`);
    return lines.join('\n');
  }
  const s = state.stats[state.mode];
  if(!s) return `🧪周期表ドリル\nニックネーム: ${nickname}\n挑戦はこちら → ${SHARE_LINK}`;
  const acc = s.total ? Math.round(s.correct/s.total*100) : 0;
  return [
    `🧪周期表ドリル - ${modeLabel}`,
    `ニックネーム: ${nickname}`,
    `範囲: ${rangeText}`,
    `正解 ${s.correct}/${s.total}（正答率${acc}%）`,
    `連続正解 ${s.streak}（自己ベスト${s.best}）`,
    `挑戦はこちら → ${SHARE_LINK}`
  ].join('\n');
}
async function handleShareClick(){
  const text = buildShareText();
  const ok = await copyToClipboard(text);
  if(ok){
    store.shareCount = (store.shareCount||0) + 1;
    saveStore();
    if(store.shareCount>=5) unlockAchievement('share5');
  }
  setFeedback(ok ? '結果をコピーしました！貼り付けて共有できます。' : 'コピーに失敗しました。お使いのブラウザではこの機能に対応していない場合があります。', ok?'good':'bad');
}

const OVERLAY_IDS = ['rankingOverlay','achievementsOverlay','settingsOverlay','nicknameOverlay'];

}
function setupOverlayDismiss(){
  OVERLAY_IDS.forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    let downTarget = null;
    el.addEventListener('pointerdown', ev=>{ downTarget = ev.target; });
    el.addEventListener('click', ev=>{
      // 押し始めも離した場所も「暗い背景」だった時だけ閉じる（枠内から外へドラッグして離した場合は閉じない）
      const onBackdrop = (ev.target===el) && (downTarget===null || downTarget===el);
      downTarget = null;
      if(onBackdrop && el.dataset.locked!=='1') el.hidden = true;
    });
  });
  const master = document.getElementById('masterOverlay');
  if(master) master.addEventListener('click', closeMasterCelebration);
  document.addEventListener('keydown', ev=>{
    if(ev.key!=='Escape') return;
    closeMasterCelebration();
    OVERLAY_IDS.forEach(id=>{
      const el = document.getElementById(id);
      if(el && !el.hidden && el.dataset.locked!=='1') el.hidden = true;
    });
  });
}

function openSettings(){
  closeOtherOverlays('settingsOverlay');
  const s = store.settings;
  document.getElementById('volumeSlider').value = Math.round(s.volume*100);
  document.getElementById('volumeValue').textContent = Math.round(s.volume*100) + '%';
  document.getElementById('muteCheck').checked = !!s.muted;
  document.getElementById('darkRow').hidden = !(store.achievements||[]).includes('overall100');
  document.getElementById('darkCheck').checked = !!store.darkMode;
  document.getElementById('settingsOverlay').hidden = false;
}
function setupSettings(){
  const slider = document.getElementById('volumeSlider');
  const label = document.getElementById('volumeValue');
  const mute = document.getElementById('muteCheck');
  const dark = document.getElementById('darkCheck');
  slider.addEventListener('input', ()=>{
    const v = (+slider.value) / 100;
    store.settings.volume = v;
    if(store.settings.muted && v>0){ store.settings.muted = false; mute.checked = false; }
    label.textContent = slider.value + '%';
    saveStore();
    Sound.applyVolume();
  });
  slider.addEventListener('change', ()=> Sound.play('correct')); // つまみを離したら確認音
  mute.addEventListener('change', ()=>{
    store.settings.muted = mute.checked;
    saveStore();
    Sound.applyVolume();
    if(!mute.checked) Sound.play('tick');
  });
  dark.addEventListener('change', ()=> setDarkMode(dark.checked, true));
  document.getElementById('settingsTestBtn').addEventListener('click', ()=>{
    Sound.play('correct');
    setTimeout(()=> Sound.play('wrong'), 650);
  });
  document.getElementById('settingsCloseBtn').addEventListener('click', ()=>{
    document.getElementById('settingsOverlay').hidden = true;
  });
}

/* =========================================================
   19. 初期化
   ========================================================= */

function startDevtoolsWatch(){
  // 簡易的な検知：devtoolsをドッキングして開くとウィンドウの外寸と内寸に大きな差が出ることを利用する。
  // 別ウィンドウ表示やモバイルでは検知できないが、遊び心の裏実績としては十分。
  setInterval(()=>{
    const widthDiff = window.outerWidth - window.innerWidth;
    const heightDiff = window.outerHeight - window.innerHeight;
    if(widthDiff > 160 || heightDiff > 160) unlockAchievement('devtools');
  }, 1500);
}

function init(){
  buildTable();
  buildTabs();
  buildLegend();
  applyRange(DEFAULT_RANGE);
  rangeSelect.value = String(DEFAULT_RANGE);
  resetAllSessionStats(DEFAULT_RANGE);
  updateNicknameDisplay();
  updateXpBar();
  updateStreakDisplay();
  startDevtoolsWatch();

  rangeSelect.addEventListener('change', ()=>{
    const newRange = parseRangeValue(rangeSelect.value);
    applyRange(newRange);
    resetAllSessionStats(newRange);
    restartCurrentMode();
  });
  document.getElementById('changeNicknameBtn').addEventListener('click', ()=> openNicknameOverlay(false));
  document.getElementById('brandLogo').addEventListener('click', ()=> unlockAchievement('logoClick'));
  document.getElementById('achievementsBtn').addEventListener('click', showAchievementsList);
  document.getElementById('rankingBtn').addEventListener('click', ()=> showRanking('exam','all', state.range));
  document.getElementById('settingsBtn').addEventListener('click', openSettings);

  setupOverlayDismiss();
  setupSettings();
  setupNicknameOverlay();
  applyTheme(false);
  // ブラウザの自動再生制限のため、最初の操作で音声を有効化する。ボタン操作には軽いクリック音を付ける
  document.addEventListener('pointerdown', ()=> Sound.unlock(), { passive:true });
  document.addEventListener('keydown', ()=> Sound.unlock());
  document.addEventListener('click', ev=>{
    const b = ev.target.closest ? ev.target.closest('button') : null;
    if(b && !b.disabled) Sound.play('tick');
  });

  ensureNickname(()=>{
    updateDailyStreak();
    updateStreakDisplay();
    switchMode('home');
  });
}
function restartCurrentMode(){
  const m = state.mode;
  if(m==='home') startHome();
  else if(m==='timeattack') startTimeAttack();
  else if(m==='exam') startExam();
  else beginQuestionKind(m);
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
